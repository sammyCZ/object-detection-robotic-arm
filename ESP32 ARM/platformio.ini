; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Show what you type and end lines with \n, which the serial console expects.
monitor_echo = yes
monitor_eol = LF
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
; Warnings only for our code, not the framework/libraries.
build_src_flags = -Wall -Wextra
